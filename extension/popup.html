<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 300px; font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
    h1 { font-size: 15px; color: #4fc3f7; margin-bottom: 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 8px; background: #12122a; border-radius: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .on { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .off { background: #f44336; }
    .row span { font-size: 12px; }
    label { display: block; font-size: 11px; color: #888; margin-bottom: 3px; }
    input { width: 100%; padding: 6px 8px; border: 1px solid #333; border-radius: 6px; background: #12122a; color: #e0e0e0; font-size: 12px; margin-bottom: 6px; }
    input:focus { border-color: #4fc3f7; outline: none; }
    button { width: 100%; padding: 7px; border: 1px solid #333; border-radius: 6px; background: #252545; color: #ccc; font-size: 12px; cursor: pointer; margin-bottom: 6px; }
    button:hover { background: #333366; color: #fff; }
    .info { font-size: 10px; color: #555; text-align: center; margin-top: 8px; }
    #msg { font-size: 11px; color: #81c784; padding: 4px 0; min-height: 16px; }
  </style>
</head>
<body>
  <h1>🔗 WebBridge</h1>
  <div class="row">
    <span class="dot" id="dot"></span>
    <span id="status">Checking...</span>
  </div>

  <label>Workspace (folder project kamu)</label>
  <input id="ws" placeholder="C:\path\to\project">
  <button id="setws">Set Workspace</button>

  <div style="margin: 8px 0 10px; display: flex; align-items: center; gap: 8px; background: #12122a; padding: 6px 8px; border-radius: 6px;">
    <input type="checkbox" id="unrestricted-chk" style="width: 14px; height: 14px; margin: 0; cursor: pointer;">
    <label for="unrestricted-chk" style="margin: 0; cursor: pointer; color: #ffb74d; font-size: 11px; user-select: none;">🌐 Global Access (Bebas Lintas Drive)</label>
  </div>

  <label>Server URL</label>
  <input id="url" placeholder="ws://127.0.0.1:9800">
  <button id="conn">Reconnect</button>

  <div id="msg"></div>
  <div class="info">Start server → set workspace → buka AI chat → klik 🔗</div>

  <script src="popup.js"></script>
</body>
</html>
